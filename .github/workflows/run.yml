name: private-job-runner
on:
  repository_dispatch:
    types: [opaque-job]
permissions:
  contents: read
jobs:
  run:
    if: github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated job
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PRIVATE_CODE_REPO: ${{ secrets.PRIVATE_CODE_REPO }}
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MOS_GMAIL_USER: ${{ secrets.MOS_GMAIL_USER }}
          MOS_GMAIL_APP_PASSWORD: ${{ secrets.MOS_GMAIL_APP_PASSWORD }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          timeout 520 python run.py || echo "job ended with an error; the bot already reported it in Telegram (kept green so GitHub does not email)"
